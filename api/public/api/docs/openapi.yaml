openapi: 3.0.3
info:
  title: FishingEmpire — API Laravel
  version: 1.0.0
  description: 'Documentação derivada de routes/api.php, Controllers, Form Requests, Resources, Services, middleware EnsureAdmin
    e Models do pacote FishingEmpire enviado nesta conversa.


    A API usa **Sanctum em modo stateful com sessão Laravel e cookies**, não emite Bearer Token nem chave de API. Use
    esta página no MESMO ORIGIN da API (ex.: http://localhost:8000/api/docs). O Swagger UI primeiro chama `/sanctum/csrf-cookie`
    em operações de escrita, lê o cookie XSRF-TOKEN e inclui `X-XSRF-TOKEN`, sempre enviando cookies.


    O carrinho visitante usa cookie HttpOnly `guest_token`. Na autenticação é fundido ao carrinho da conta com avisos
    quando é limitado ao estoque.


    Respostas de Resources normalmente usam `{ "data": ... }`; Collections paginadas incluem `links` e `meta`. Não são
    usados tokens Bearer.


    Para funcionar atrás de um proxy, ele precisa preservar `/api/` e também encaminhar `/sanctum/csrf-cookie` para a
    API.'
servers:
- url: /
  description: Mesmo host da página Swagger UI. Os paths já contêm /api (não duplicar prefixo).
tags:
- name: Autenticação
- name: Perfil
- name: Catálogo
- name: Carrinho
- name: Endereços
- name: Pedidos
- name: 'Administração: produtos'
- name: 'Administração: categorias'
- name: 'Administração: pedidos'
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
      - Autenticação
      summary: Inicializa cookie CSRF da sessão (Sanctum)
      description: Endpoint do pacote Laravel Sanctum, não definido em routes/api.php. Responde com os cookies XSRF-TOKEN
        e cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração) (pode atualizar sessão existente).
      responses:
        '204':
          description: Operação concluída.
  /api/auth/register:
    post:
      tags:
      - Autenticação
      summary: Registrar cliente
      description: 'Cria User comum (is_admin não é mass assignable), faz login por sessão, regenera sessão e tenta fundir
        carrinho visitante. `warnings` lista ajustes e `cart_merged` indica execução da fusão.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/Throttled'
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Fazer login
      description: 'Auth::guard(web)->attempt; regenera sessão e tenta fundir carrinho de visitante, com avisos de estoque.
        Sem Bearer Token.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/Throttled'
  /api/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Encerrar sessão
      description: 'Invalida sessão e regenera CSRF; corpo JSON contém apenas `message`.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user:
    get:
      tags:
      - Perfil
      summary: Obter usuário autenticado
      description: Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profile:
    get:
      tags:
      - Perfil
      summary: Consultar perfil
      description: Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Perfil
      summary: Atualizar perfil
      description: 'Todos campos opcionais; senha nova deve conter confirmação. Campos adicionais são descartados.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
  /api/products:
    get:
      tags:
      - Catálogo
      summary: Listar produtos ativos
      description: Somente is_active=true; categoria eager loaded. Paginação fixa de 12 produtos por página.
      parameters:
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
        description: Busca LIKE no nome.
      - name: category_id
        in: query
        schema:
          type: integer
          minimum: 1
        description: ID existente em categories.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - price_asc
          - price_desc
          - name_asc
          - name_desc
          - recent
          - oldest
        description: 'Padrão: ID crescente.'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          $ref: '#/components/responses/Validation'
  /api/products/{id}:
    get:
      tags:
      - Catálogo
      summary: Consultar produto ativo
      description: Produto ausente ou inativo retorna 404.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/categories:
    get:
      tags:
      - Catálogo
      summary: Listar categorias
      description: Ordenadas por nome; sem paginação.
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
  /api/categories/{id}:
    get:
      tags:
      - Catálogo
      summary: Consultar categoria
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/cart:
    get:
      tags:
      - Carrinho
      summary: Consultar carrinho atual
      description: Acessível a visitantes e autenticados. Visitante usa cookie HttpOnly guest_token criado/renovado pela
        API. Autenticado usa user_id; totais do Resource calculados no servidor.
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
  /api/cart/items:
    post:
      tags:
      - Carrinho
      summary: Adicionar produto ou somar quantidade
      description: 'Adicionar produto já presente soma a quantidade. Rejeita produto inativo, quantidade inválida ou estoque
        insuficiente.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /api/cart/items/{item}:
    patch:
      tags:
      - Carrinho
      summary: Definir quantidade do item
      description: 'Se quantidade = 0, remove o item; caso contrário substitui quantidade. O ID é escopado ao carrinho
        atual.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/item'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - Carrinho
      summary: Remover item do carrinho
      description: 'Remove apenas cart_items, não o carrinho nem o produto. O item deve pertencer ao carrinho identificado
        pela sessão/cookie.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/item'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/addresses:
    get:
      tags:
      - Endereços
      summary: Listar endereços próprios
      description: 'Retorna coleção sem paginação, ordenada por id decrescente.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Endereços
      summary: Criar endereço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateInput'
      description: 'Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      responses:
        '201':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
  /api/addresses/{id}:
    patch:
      tags:
      - Endereços
      summary: Alterar endereço próprio
      description: 'Consulta sempre dentro de $request->user()->addresses().


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - Endereços
      summary: Excluir endereço próprio
      description: 'Resposta sem corpo.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Operação concluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders:
    get:
      tags:
      - Pedidos
      summary: Listar meus pedidos
      description: '12 pedidos por página, id decrescente. A listagem não carrega orderItems: propriedade items é omitida.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).'
      parameters:
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Pedidos
      summary: Finalizar compra
      description: 'AddressId deve pertencer à conta; exige carrinho não vazio, produto ativo e estoque. Dentro de transação
        bloqueia produtos, cria Order pendente e OrderItems com preços/nome congelados, decrementa estoque e esvazia cart_items.
        Frete R$ 15,00 abaixo de R$ 200,00 de subtotal; grátis a partir desse valor.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateInput'
      responses:
        '201':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /api/orders/{id}:
    get:
      tags:
      - Pedidos
      summary: Consultar pedido próprio ou do administrador
      description: 'Service findVisibleOrder permite ao admin ver pedido de outro usuário; para cliente comum restringe
        ao próprio user_id.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders/{id}/pay:
    post:
      tags:
      - Pedidos
      summary: Confirmar pagamento simulado
      description: 'Somente dono do pedido (mesmo se admin). Somente status pendente → pago. Preenche paid_at. Nenhum
        cartão ou pagamento real.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/orders/{id}/cancel:
    post:
      tags:
      - Pedidos
      summary: Cancelar pedido e devolver estoque
      description: 'Dono ou administrador. Somente status pendente → cancelado; restaura estoque com lock em transação.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/products:
    get:
      tags:
      - 'Administração: produtos'
      summary: Listar todos os produtos (inclusive inativos)
      description: 'Produtos ordenados por id desc; 12 por página.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.'
      parameters:
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - 'Administração: produtos'
      summary: Cadastrar produto
      description: 'Aceita campos JSON ou upload opcional de imagem no multipart/form-data. Imagem: validação image|max:4096,
        armazenada no disco public/products. Se is_active omitido, valor true.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateMultipart'
      responses:
        '201':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /api/admin/products/{id}:
    put:
      tags:
      - 'Administração: produtos'
      summary: Editar produto
      description: 'Ambos métodos executam o mesmo handler; campos com `sometimes` podem ser enviados parcialmente. A
        validação prevê `image`, mas upload multipart em PUT/PATCH depende da interpretação multipart pelo servidor PHP.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdateMultipart'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    patch:
      tags:
      - 'Administração: produtos'
      summary: Editar produto
      description: 'Ambos métodos executam o mesmo handler; campos com `sometimes` podem ser enviados parcialmente. A
        validação prevê `image`, mas upload multipart em PUT/PATCH depende da interpretação multipart pelo servidor PHP.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdateMultipart'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - 'Administração: produtos'
      summary: Desativar produto (não exclui fisicamente)
      description: 'Define is_active=false. Resposta JSON `message` com confirmação.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/categories:
    post:
      tags:
      - 'Administração: categorias'
      summary: Criar categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateInput'
      description: 'Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      responses:
        '201':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /api/admin/categories/{id}:
    put:
      tags:
      - 'Administração: categorias'
      summary: Editar categoria
      description: 'Ambos métodos usam o mesmo Form Request; campos opcionais e parciais.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    patch:
      tags:
      - 'Administração: categorias'
      summary: Editar categoria
      description: 'Ambos métodos usam o mesmo Form Request; campos opcionais e parciais.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
      - 'Administração: categorias'
      summary: Excluir categoria sem produtos vinculados
      description: 'Retorna 409 se a categoria tiver produtos; 204 sem corpo em sucesso.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Operação concluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/orders:
    get:
      tags:
      - 'Administração: pedidos'
      summary: Listar pedidos de toda a loja
      description: 'Pagina 12 pedidos por página; carrega user (customer), mas não orderItems na listagem.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.'
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pendente
          - pago
          - enviado
          - entregue
          - cancelado
        description: Filtro opcional.
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
  /api/admin/orders/{id}/status:
    patch:
      tags:
      - 'Administração: pedidos'
      summary: Avançar status do pedido
      description: 'Service permite somente pago → enviado e enviado → entregue. Outros status validáveis causam 409 se
        a transição for incompatível.


        Requer sessão Laravel/Sanctum autenticada (cookie cookie de sessão Laravel (por padrão, fishingempire-session nesta configuração)).


        Requer adicionalmente `is_admin = true`, validado pelo middleware `EnsureAdmin`.


        Requer CSRF via cookie XSRF-TOKEN + cabeçalho X-XSRF-TOKEN; o Swagger UI os prepara automaticamente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusInput'
      responses:
        '200':
          description: Resposta da API conforme o Resource/Controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
components:
  schemas:
    Money:
      type: string
      pattern: ^\d+\.\d{2}$
      example: '109.90'
      description: Valor decimal formatado como string pelo backend.
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
      required:
      - id
      - name
      - email
      - is_admin
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
      - id
      - name
      - description
    ProductCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'
        image_path:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/ProductCategory'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - stock
      - is_active
      - price
      - image_path
      - created_at
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        available:
          type: boolean
        image_path:
          type: string
          nullable: true
        unit_price:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - product_id
      - name
      - quantity
      - stock
      - is_active
      - available
      - image_path
      - unit_price
      - subtotal
    Cart:
      type: object
      properties:
        id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - items
      - total
    Address:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        house_number:
          type: string
        cep:
          type: string
          pattern: ^\d{8}$
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
      required:
      - id
      - address
      - house_number
      - cep
      - city
      - state
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        product_price:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - product_id
      - product_name
      - quantity
      - product_price
      - subtotal
    Shipping:
      type: object
      properties:
        address:
          type: string
        number:
          type: string
        cep:
          type: string
        city:
          type: string
        state:
          type: string
      required:
      - address
      - number
      - cep
      - city
      - state
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        customer:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
          required:
          - id
          - name
          - email
        status:
          type: string
          enum:
          - pendente
          - pago
          - enviado
          - entregue
          - cancelado
        total:
          $ref: '#/components/schemas/Money'
        shipping_cost:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Shipping'
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - user_id
      - status
      - total
      - shipping_cost
      - shipping
      - paid_at
      - created_at
      description: customer aparece apenas quando a relação user é carregada (listagem administrativa). items aparece
        apenas quando orderItems é carregada (detalhe, checkout, pagamento, cancelamento, mudança de status).
    CartMergeWarning:
      type: object
      properties:
        product_id:
          type: integer
        message:
          type: string
        requested:
          type: integer
        accepted:
          type: integer
      required:
      - product_id
      - message
      description: requested e accepted somente quando houve limitação por estoque.
    AuthSuccess:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CartMergeWarning'
        cart_merged:
          type: boolean
      required:
      - message
      - user
      - warnings
      - cart_merged
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: true
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
      - errors
      additionalProperties: true
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
      required:
      - first
      - last
      - prev
      - next
      additionalProperties: true
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
            required:
            - url
            - label
            - active
            additionalProperties: true
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
      required:
      - current_page
      - last_page
      - links
      - path
      - per_page
      - total
      additionalProperties: true
    UserEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
      required:
      - data
    CategoryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Category'
      required:
      - data
    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - data
    ProductEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
      required:
      - data
    ProductPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - links
      - meta
    CartEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Cart'
      required:
      - data
    AddressEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Address'
      required:
      - data
    AddressList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - data
    OrderEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Order'
      required:
      - data
    OrderPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - links
      - meta
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
      required:
      - email
      - password
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          minLength: 8
      required:
      - name
      - email
      - password
      - password_confirmation
    CartAddInput:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    CartUpdateInput:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
          description: 0 exclui o item do carrinho.
      required:
      - quantity
    AddressCreateInput:
      type: object
      properties: &id001
        address:
          type: string
          maxLength: 255
        house_number:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 255
        state:
          type: string
          minLength: 2
          maxLength: 2
        cep:
          type: string
          pattern: ^\d{8}$
          description: O Form Request aplica digits:8.
      required:
      - address
      - house_number
      - city
      - state
      - cep
    AddressUpdateInput:
      type: object
      properties: *id001
    OrderCreateInput:
      type: object
      properties:
        address_id:
          type: integer
      required:
      - address_id
    ProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          minLength: 8
          description: Obrigatório somente se password for enviado (regra confirmed).
    CategoryCreateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required:
      - name
    CategoryUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
    ProductCreateInput:
      type: object
      properties: &id002
        category_id: &id003
          type: integer
        name: &id004
          type: string
          maxLength: 255
        description: &id005
          type: string
          nullable: true
        price: &id006
          type: string
          pattern: ^\d{1,8}(?:\.\d{1,2})?$
        stock: &id007
          type: integer
          minimum: 0
        is_active: &id008
          type: boolean
        image_path: &id009
          type: string
          maxLength: 255
          nullable: true
      required:
      - category_id
      - name
      - price
      - stock
    ProductUpdateInput:
      type: object
      properties: *id002
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
          - pendente
          - pago
          - enviado
          - entregue
          - cancelado
          description: A validação aceita esses valores, mas o Service só permite pago → enviado ou enviado → entregue.
      required:
      - status
    ProductCreateMultipart:
      type: object
      properties:
        category_id: *id003
        name: *id004
        description: *id005
        price: *id006
        stock: *id007
        is_active: *id008
        image_path: *id009
        image: &id010
          type: string
          format: binary
          description: 'Imagem opcional: image, máximo 4096 KB.'
      required:
      - category_id
      - name
      - price
      - stock
    ProductUpdateMultipart:
      type: object
      properties:
        category_id: *id003
        name: *id004
        description: *id005
        price: *id006
        stock: *id007
        is_active: *id008
        image_path: *id009
        image: *id010
  responses:
    Unauthorized:
      description: Não autenticado (middleware auth:sanctum).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Permissão insuficiente (middleware EnsureAdmin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Acesso restrito ao administrador.
    NotFound:
      description: Recurso não encontrado, inativo no catálogo público ou não pertencente ao usuário.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not Found
    Validation:
      description: Falha de validação (Form Request ou regra do Service).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The given data was invalid.
            errors:
              quantity:
              - Quantidade inválida ou estoque insuficiente.
    Conflict:
      description: Operação incompatível com status atual ou vínculo existente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Transição de status inválida.
    Throttled:
      description: Limite de tentativas atingido (throttle).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    id:
      name: id
      in: path
      required: true
      description: ID do recurso.
      schema:
        type: integer
        minimum: 1
    item:
      name: item
      in: path
      required: true
      description: ID de cart_items (não do produto).
      schema:
        type: integer
        minimum: 1
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Página do paginator Laravel (12 itens por página).
